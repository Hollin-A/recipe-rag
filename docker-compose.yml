services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      # Local development only: the port below is reachable from this machine alone.
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe
    ports:
      # 5433 on the host, so it can't clash with a Postgres you already run on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
